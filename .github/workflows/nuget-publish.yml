name: Publish NuGet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build, Pack, Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Aplicada1.Core/Aplicada1.Core.csproj

      - name: Build
        run: dotnet build Aplicada1.Core/Aplicada1.Core.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack Aplicada1.Core/Aplicada1.Core.csproj -c Release --no-build -o ./artifacts

      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
